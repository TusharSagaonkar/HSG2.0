{% load i18n %}
<div class="empty-state">
  <div class="empty-state__icon">
    <i class="fas {{ icon|default:'fa-inbox' }}"></i>
  </div>
  <h3 class="empty-state__title">{{ title|default:_("No items found") }}</h3>
  <p class="empty-state__message">{{ message|default:_("There are no items to display at this time.") }}</p>
  {% if action_url and action_label %}
    <a href="{{ action_url }}" class="btn-action btn-action--primary mt-3">
      {% if action_icon %}<i class="{{ action_icon }} me-1"></i>{% endif %}
      {{ action_label }}
    </a>
  {% endif %}
</div>
