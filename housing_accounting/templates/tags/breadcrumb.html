{% if items %}
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
      {% for item in items %}
        <li class="breadcrumb-item {% if item.active %}active{% endif %}">
          {% if item.url and not item.active %}
            <a href="{{ item.url }}">{{ item.label }}</a>
          {% else %}
            {{ item.label }}
          {% endif %}
        </li>
      {% endfor %}
    </ol>
  </nav>
{% endif %}
